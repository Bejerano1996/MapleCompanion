name: Build and publish verified versions
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - requirements.txt
      - assets/**
      - icon.ico
      - icon.png
      - tools/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: companion-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether this source version needs a build
        id: plan
        run: python tools/ci_release.py --plan
      - name: Install build dependencies
        if: steps.plan.outputs.build == 'true'
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Verify EXP, reward accounting and quest rediscovery
        if: steps.plan.outputs.build == 'true'
        run: |
          python tools/test_release_tools.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_data*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_alternate_sources.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($pattern in @('test_public_http.py', 'test_index_cache*.py', 'test_game_window_identity.py', 'test_screen_visibility.py', 'test_occluded_capture.py', 'test_context*.py', 'test_reader_health.py', 'test_close_persistence.py', 'test_reference_only_ui.py')) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s tests -p "test_training_model.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_quest*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_sync*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_realtime_reader.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Full cached-game UI checks run locally; CI cannot fetch paused provider data.
          # Fresh-install reference UI and native-close checks above use isolated fixtures.
      - name: Build Windows application
        if: steps.plan.outputs.build == 'true'
        run: python build_release.py --output "dist/Umbrale Companion"
      - name: Package and publish a new version
        if: steps.plan.outputs.build == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_release.py --publish
      - name: Verify packaging without publishing an existing version
        if: steps.plan.outputs.build == 'true' && github.event_name == 'workflow_dispatch'
        run: python tools/ci_release.py
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: verified-windows-${{ steps.plan.outputs.version }}
          path: release-artifacts/*
          retention-days: 14
